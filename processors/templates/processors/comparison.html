<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Disco — Сравнение процессоров</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00ff9d, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .add-btn, .clear-btn {
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .add-btn {
            background: linear-gradient(90deg, #00ff9d, #00c6ff);
            color: #000;
        }
        .clear-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .add-btn:hover, .clear-btn:hover { transform: scale(1.03); }
        .empty-state {
            margin-top: 60px;
            text-align: center;
            color: #777;
        }
        .empty-state span { font-size: 3rem; display: block; margin-bottom: 15px; }

        /* Карточка процессора */
        .cpu-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cpu-info h3 { font-size: 1.25rem; margin-bottom: 6px; }
        .cpu-meta { color: #aaa; font-size: 0.95rem; }
        .remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px 10px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { font-size: 1.4rem; }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .search-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus { border-color: #00ff9d; }
        .search-results {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .search-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .search-item:hover { background: rgba(0,255,157,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>CPU Disco</h1>
        <p class="subtitle">Умный инструмент сравнения процессоров</p>

        <div class="top-bar">
            <button class="add-btn" onclick="openModal()">+ Добавить процессор</button>
            <button class="clear-btn" onclick="clearAll()" id="clearBtn" style="display:none;">Очистить всё</button>
        </div>

        <div class="empty-state" id="emptyState">
            <span>🔍</span>
            <p>Список сравнения пуст</p>
            <p style="margin-top: 8px; font-size: 0.95rem;">Нажмите «Добавить процессор», чтобы начать</p>
        </div>

        <div id="comparisonList"></div>
    </div>

    <!-- Модальное окно поиска -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить процессор</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="Начните вводить название..." oninput="searchProcessors()">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <script>
        let selectedCPUs = [];

        function openModal() {
            document.getElementById('searchModal').classList.add('active');
            document.getElementById('searchInput').focus();
        }

        function closeModal() {
            document.getElementById('searchModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }

        async function searchProcessors() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            resultsDiv.innerHTML = '<div class="search-item">Ищем...</div>';

            try {
                const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="search-item">Ничего не найдено</div>';
                    return;
                }

                resultsDiv.innerHTML = data.results.map(cpu => `
                    <div class="search-item" onclick='addProcessor(${JSON.stringify(cpu)})'>
                        <strong>${cpu.name}</strong><br>
                        <small style="color:#aaa">${cpu.manufacturer} · ${cpu.cores || '?'} ядер · ${cpu.release_year || ''}</small>
                    </div>
                `).join('');
            } catch (error) {
                resultsDiv.innerHTML = '<div class="search-item">Ошибка поиска</div>';
            }
        }

        function addProcessor(cpu) {
            // Не добавляем дубликаты
            if (selectedCPUs.find(c => c.id === cpu.id)) {
                closeModal();
                return;
            }

            selectedCPUs.push(cpu);
            renderList();
            closeModal();
        }

        function removeProcessor(id) {
            selectedCPUs = selectedCPUs.filter(c => c.id !== id);
            renderList();
        }

        function clearAll() {
            selectedCPUs = [];
            renderList();
        }

        function renderList() {
            const list = document.getElementById('comparisonList');
            const empty = document.getElementById('emptyState');
            const clearBtn = document.getElementById('clearBtn');

            if (selectedCPUs.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                clearBtn.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            clearBtn.style.display = 'inline-block';

            list.innerHTML = selectedCPUs.map(cpu => `
                <div class="cpu-card">
                    <div class="cpu-info">
                        <h3>${cpu.name}</h3>
                        <div class="cpu-meta">
                            ${cpu.manufacturer} · ${cpu.cores || '?'} ядер / ${cpu.threads || '?'} потоков · ${cpu.release_year || ''}
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeProcessor(${cpu.id})">×</button>
                </div>
            `).join('');
        }

        // Закрытие по клику вне окна
        document.getElementById('searchModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
