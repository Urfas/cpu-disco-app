<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Compare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #E8EEF8;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 20px;
            max-width: 960px;
            margin: 0 auto;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #7EE0FF;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        select, button {
            font: inherit;
        }

        #benchSelect {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #E8EEF8;
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 180px;
        }

        #benchSelect option {
            color: #111;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add {
            background: linear-gradient(90deg, #1BB8FF, #2EE6A8);
            color: #0b1220;
        }

        .btn-clear {
            background: rgba(255,255,255,0.08);
            color: #D5DEF0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover { filter: brightness(1.08); }

        .empty {
            max-width: 960px;
            margin: 40px auto;
            text-align: center;
            color: #8B9BB4;
            padding: 0 16px;
        }

        .compare-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 960px;
            margin: 0 auto;
            padding: 8px 16px 48px;
        }

        /* ===== Card ===== */
        .cpu-card {
            position: relative;
            display: grid;
            grid-template-columns: 132px 1fr;
            grid-template-rows: auto auto;
            gap: 14px 18px;
            padding: 18px 18px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cpu-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
        }

        .cpu-card .remove {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #8B9BB4;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .cpu-card .remove:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .cpu-sil {
            grid-row: 1;
            grid-column: 1;
            width: 132px;
            height: 132px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(160deg, #1a2235, #121826);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .cpu-sil.amd   { box-shadow: inset 0 0 0 1px rgba(220, 60, 60, 0.25); }
        .cpu-sil.intel { box-shadow: inset 0 0 0 1px rgba(60, 120, 220, 0.25); }
        .cpu-sil.apple { box-shadow: inset 0 0 0 1px rgba(180, 180, 190, 0.25); }
        .cpu-sil.other { box-shadow: inset 0 0 0 1px rgba(140, 100, 220, 0.2); }

        .cpu-sil-shape {
            width: 78px;
            height: 78px;
            border-radius: 8px;
            background: linear-gradient(145deg, #2a3348, #1c2436);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .cpu-sil-shape::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 7px;
            height: 6px;
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .cpu-sil-socket {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: #8B9BB4;
            text-transform: uppercase;
        }

        .cpu-main {
            grid-row: 1;
            grid-column: 2;
            padding-right: 28px;
            min-width: 0;
        }

        .cpu-name {
            margin: 0 0 4px;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -0.01em;
            color: #E8EEF8;
            line-height: 1.25;
        }

        .cpu-meta {
            margin: 0 0 14px;
            font-size: 13px;
            color: #8B9BB4;
        }

        .cpu-meta strong {
            color: #B7C4D8;
            font-weight: 500;
        }

        .bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .bar-track {
            position: relative;
            height: 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .bar-multi {
            position: absolute;
            inset: 0 auto 0 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #1BB8FF, #2EE6A8);
        }

        .bar-single {
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 0;
            border-radius: 999px;
            background: #FFD36E;
            opacity: 0.9;
        }

        .bar-pct {
            font-size: 13px;
            font-weight: 600;
            color: #E8EEF8;
            min-width: 48px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .bar-pct .approx {
            margin-left: 3px;
            color: #C9A24A;
            font-weight: 700;
        }

        .bar-label {
            font-size: 11px;
            color: #7E8FA8;
        }

        .cpu-strip {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 0;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .strip-item {
            flex: 1 1 0;
            min-width: 72px;
            padding: 0 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .strip-item:last-child { border-right: none; }

        .strip-label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6E7F99;
            margin-bottom: 3px;
        }

        .strip-value {
            display: block;
            font-size: 13px;
            font-weight: 560;
            color: #D5DEF0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .strip-item.more {
            flex: 0 0 auto;
            min-width: 44px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .strip-more-btn {
            width: 34px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #A9B7CC;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .strip-more-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 50;
            align-items: flex-start;
            justify-content: center;
            padding: 80px 16px 16px;
        }

        .modal.open { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 480px;
            background: #1a1f35;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .modal-box input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #1BB8FF;
        }

        #searchResults {
            margin-top: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .search-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .search-item small {
            color: #8B9BB4;
        }

        @media (max-width: 640px) {
            .cpu-card {
                grid-template-columns: 96px 1fr;
                gap: 12px;
                padding: 14px 12px 12px;
            }
            .cpu-sil { width: 96px; height: 96px; }
            .cpu-sil-shape { width: 56px; height: 56px; }
            .cpu-name { font-size: 16px; }
            .strip-item { min-width: 30%; border-right: none; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">CPU Compare</div>
        <div class="top-actions">
            <select id="benchSelect">
                <option value="overall_score">Общий рейтинг</option>
                <option value="passmark">PassMark</option>
                <option value="geekbench4_multi">Geekbench 4 Multi</option>
                <option value="geekbench4_single">Geekbench 4 Single</option>
                <option value="cinebench_r15_multi">Cinebench R15 Multi</option>
                <option value="cinebench_r15_single">Cinebench R15 Single</option>
                <option value="cinebench_r11_multi">Cinebench R11 Multi</option>
                <option value="cinebench_r11_single">Cinebench R11 Single</option>
                <option value="threedmark06_cpu">3DMark06 CPU</option>
                <option value="winrar">WinRAR</option>
                <option value="x264_pass1">x264 Pass 1</option>
                <option value="x264_pass2">x264 Pass 2</option>
            </select>
            <button class="btn btn-add" onclick="openModal()">+ Добавить</button>
            <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
        </div>
    </div>

    <div id="emptyState" class="empty">
        Добавь 2–3 процессора через «+ Добавить», чтобы сравнить их.
    </div>

    <div class="compare-list" id="compareList"></div>

    <div class="modal" id="searchModal">
        <div class="modal-box">
            <input id="searchInput" type="text" placeholder="Название процессора..." autocomplete="off">
            <div id="searchResults"></div>
        </div>
    </div>

    <script>
        // selected: [{id, data}]
        let selected = [];

        const BENCH_LABELS = {
            overall_score: 'Общий рейтинг',
            passmark: 'PassMark',
            geekbench4_multi: 'Geekbench 4 Multi',
            geekbench4_single: 'Geekbench 4 Single',
            cinebench_r15_multi: 'Cinebench R15 Multi',
            cinebench_r15_single: 'Cinebench R15 Single',
            cinebench_r11_multi: 'Cinebench R11 Multi',
            cinebench_r11_single: 'Cinebench R11 Single',
            threedmark06_cpu: '3DMark06 CPU',
            winrar: 'WinRAR',
            x264_pass1: 'x264 Pass 1',
            x264_pass2: 'x264 Pass 2',
        };

        // Для overall можно поверх показать single, если выберешь multi-бенч
        const SINGLE_PAIR = {
            geekbench4_multi: 'geekbench4_single',
            cinebench_r15_multi: 'cinebench_r15_single',
            cinebench_r11_multi: 'cinebench_r11_single',
        };

        function openModal() {
            document.getElementById('searchModal').classList.add('open');
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('searchResults').innerHTML = '';
            setTimeout(() => input.focus(), 50);
        }

        function closeModal() {
            document.getElementById('searchModal').classList.remove('open');
        }

        document.getElementById('searchModal').addEventListener('click', (e) => {
            if (e.target.id === 'searchModal') closeModal();
        });

        let searchTimer = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const q = e.target.value.trim();
            const box = document.getElementById('searchResults');
            if (q.length < 2) {
                box.innerHTML = '';
                return;
            }
            box.innerHTML = '<div class="search-item">Ищем...</div>';
            searchTimer = setTimeout(() => doSearch(q), 250);
        });

        async function doSearch(q) {
            const box = document.getElementById('searchResults');
            try {
                const res = await fetch(`/api/search/?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (!data.results.length) {
                    box.innerHTML = '<div class="search-item">Ничего не найдено</div>';
                    return;
                }
                box.innerHTML = data.results.map(cpu => `
                    <div class="search-item" onclick="addProcessor(${cpu.id})">
                        <strong>${escapeHtml(cpu.name)}</strong><br>
                        <small>${escapeHtml(cpu.manufacturer || '')} · ${cpu.cores || '?'} ядер · ${cpu.release_year || ''}</small>
                    </div>
                `).join('');
            } catch (err) {
                box.innerHTML = '<div class="search-item">Ошибка поиска</div>';
            }
        }

        async function addProcessor(id) {
            if (selected.some(x => x.id === id)) {
                closeModal();
                return;
            }
            try {
                const res = await fetch(`/api/processor/${id}/`);
                if (!res.ok) throw new Error('fail');
                const data = await res.json();
                selected.push({ id, data });
                closeModal();
                render();
            } catch (e) {
                alert('Не удалось загрузить процессор');
            }
        }

        function removeProcessor(id) {
            selected = selected.filter(x => x.id !== id);
            render();
        }

        function clearAll() {
            selected = [];
            render();
        }

        document.getElementById('benchSelect').addEventListener('change', render);

        function vendorClass(m) {
            m = (m || '').toLowerCase();
            if (m.includes('amd')) return 'amd';
            if (m.includes('intel')) return 'intel';
            if (m.includes('apple')) return 'apple';
            return 'other';
        }

        function fmtClock(base, boost) {
            if (base == null && boost == null) return '—';
            if (base != null && boost != null) return `${base}–${boost}`;
            return String(base ?? boost);
        }

        function shortMemory(mem) {
            if (!mem) return '—';
            const m = String(mem).match(/DDR\d/gi);
            return m ? [...new Set(m.map(x => x.toUpperCase()))].join('/') : '—';
        }

        function igpuText(cpu) {
            if (cpu.igpu_name) return cpu.igpu_name;
            if (cpu.integrated_graphics) return 'есть';
            return '—';
        }

        function categoryText(c) {
            const map = {
                Desktop: 'Desktop',
                Mobile: 'Mobile',
                Server: 'Server',
                Embedded: 'Embedded',
            };
            return map[c] || c || '';
        }

        function escapeHtml(s) {
            return String(s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;');
        }

        function getBench(cpu, key) {
            const b = (cpu.benchmarks || {})[key];
            if (!b || b.value == null) return null;
            return b;
        }

        function render() {
            const list = document.getElementById('compareList');
            const empty = document.getElementById('emptyState');
            const benchKey = document.getElementById('benchSelect').value;
            const singleKey = SINGLE_PAIR[benchKey] || null;

            if (!selected.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            // max for current bench
            let maxVal = 0;
            selected.forEach(({ data }) => {
                const b = getBench(data, benchKey);
                if (b && b.value != null && b.value > maxVal) maxVal = b.value;
            });

            list.innerHTML = selected.map(({ id, data }) => {
                const b = getBench(data, benchKey);
                const s = singleKey ? getBench(data, singleKey) : null;

                let multiPct = 0;
                let singlePct = 0;
                let approxMark = '';

                if (b && maxVal > 0) {
                    multiPct = Math.max(0, Math.min(100, (b.value / maxVal) * 100));
                    if (b.approx) approxMark = '<span class="approx" title="Приблизительно">?</span>';
                }
                if (s && maxVal > 0) {
                    singlePct = Math.max(0, Math.min(100, (s.value / maxVal) * 100));
                }

                const pctText = b && b.value != null
                    ? `${Math.round(multiPct)}%${approxMark}`
                    : `—`;

                const vClass = vendorClass(data.manufacturer);
                const socket = data.socket || '—';

                return `
                <article class="cpu-card" data-id="${id}">
                    <button class="remove" title="Убрать" onclick="removeProcessor(${id})">×</button>

                    <div class="cpu-sil ${vClass}">
                        <div class="cpu-sil-shape"></div>
                        <div class="cpu-sil-socket">${escapeHtml(socket.replace(/^Socket\s+/i, ''))}</div>
                    </div>

                    <div class="cpu-main">
                        <h3 class="cpu-name">${escapeHtml(data.name)}</h3>
                        <p class="cpu-meta">
                            <strong>${escapeHtml(data.manufacturer || '')}</strong>
                            ${data.category ? ' · ' + escapeHtml(categoryText(data.category)) : ''}
                            · ${data.cores || '?'} ядер / ${data.threads || '?'} потоков
                        </p>

                        <div class="bars">
                            <div class="bar-row">
                                <div class="bar-track">
                                    <div class="bar-multi" style="width:${multiPct}%"></div>
                                    ${s && s.value != null ? `<div class="bar-single" style="width:${singlePct}%"></div>` : ''}
                                </div>
                                <div class="bar-pct">${pctText}</div>
                            </div>
                            <div class="bar-label">${escapeHtml(BENCH_LABELS[benchKey] || benchKey)}</div>
                        </div>
                    </div>

                    <div class="cpu-strip">
                        <div class="strip-item">
                            <span class="strip-label">Год</span>
                            <span class="strip-value">${data.release_year || '—'}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">Процесс</span>
                            <span class="strip-value">${escapeHtml(data.lithography || '—')}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">TDP</span>
                            <span class="strip-value">${data.tdp != null ? data.tdp + ' W' : '—'}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">Сокет</span>
                            <span class="strip-value">${escapeHtml(socket)}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">Ядра</span>
                            <span class="strip-value">${data.cores || '?'} / ${data.threads || '?'}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">Частота</span>
                            <span class="strip-value">${fmtClock(data.base_clock, data.boost_clock)}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">Память</span>
                            <span class="strip-value">${escapeHtml(shortMemory(data.memory_support))}</span>
                        </div>
                        <div class="strip-item">
                            <span class="strip-label">iGPU</span>
                            <span class="strip-value">${escapeHtml(igpuText(data))}</span>
                        </div>
                        <div class="strip-item more">
                            <button class="strip-more-btn" title="Подробнее" onclick="alert('Полный паспорт — следующим шагом')">⋯</button>
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        render();
    </script>
</body>
</html>
