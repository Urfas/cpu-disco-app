<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Disco — Сравнение процессоров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00ff9d, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
        }
        .add-btn {
            background: linear-gradient(90deg, #00ff9d, #00c6ff);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .add-btn:hover {
            transform: scale(1.03);
        }
        .empty-state {
            margin-top: 80px;
            text-align: center;
            color: #777;
        }
        .empty-state span {
            font-size: 3rem;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CPU Disco</h1>
        <p class="subtitle">Умный инструмент сравнения процессоров</p>

        <button class="add-btn">+ Добавить процессор</button>

        <div class="empty-state">
            <span>🔍</span>
            <p>Список сравнения пуст</p>
            <p style="margin-top: 8px; font-size: 0.95rem;">Нажмите «Добавить процессор», чтобы начать</p>
        </div>
    </div>
</body>
</html>
        <p>Пока нет процессоров в базе.</p>
    {% endfor %}
</body>
</html>
